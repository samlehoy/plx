# Automatic releases. One version for everything plx ships: the npm package, the Companion
# extension and the website (docs/RELEASING.md).
#
# Every push to master lets release-please read the Conventional Commits since the last release and
# keep one "chore(master): release x.y.z" PR open, with package.json, the extension manifest and
# CHANGELOG.md already bumped. Merging that PR is the release: release-please tags vX.Y.Z and
# creates the GitHub release, then the jobs below publish what was tagged.
name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        # Config: release-please-config.json + .release-please-manifest.json (the action's defaults).

  npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC): no long-lived npm token in the repo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # prepublishOnly runs version:check and the build.
      - run: npm publish

  extension:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the zip to the release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - run: node scripts/sync-version.mjs --check
      - name: Attach the extension to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          ZIP: plx-companion-${{ needs.release-please.outputs.version }}.zip
        run: |
          # git archive, not zip(1): the zip on ubuntu-26.04 produced no archive at that path.
          git archive -o "$ZIP" HEAD:extension ':(exclude)README.md'
          gh release upload "$TAG" "$ZIP" --clobber

  website:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # The site prints the version it was built with, so it is redeployed on each release. The job
      # is a no-op until the Cloudflare secrets exist, for setups that deploy the site another way.
      - if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::notice::CLOUDFLARE_API_TOKEN not set; skipping the website deploy."
      - if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        working-directory: web
        run: npm ci && npm run build
      - if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
